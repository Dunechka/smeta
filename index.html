<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Смета за 5 минут</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">ПРОСТО О ДЕЛЕ</p>
      <h1>Смета за 5 минут</h1>
      <p class="hint">Добавьте позиции и цены — суммы посчитаются автоматически.</p>
    </header>
    <h1 id="print-heading" class="print-only"></h1>

    <section class="card" aria-labelledby="details-heading">
      <h2 id="details-heading">Реквизиты</h2>
      <div class="details">
        <label>От кого<input type="text" id="sender" placeholder="Ваше имя или компания"></label>
        <label>Для кого<input type="text" id="recipient" placeholder="Имя или компания клиента"></label>
        <label>Номер сметы<input type="text" id="estimate-number" placeholder="Например, 001"></label>
        <label>Дата<input type="date" id="estimate-date"></label>
      </div>
    </section>

    <section class="card positions" aria-labelledby="positions-heading">
      <h2 id="positions-heading">Позиции</h2>
      <table>
        <caption class="sr-only">Позиции сметы и их стоимость</caption>
        <thead><tr><th scope="col">Наименование</th><th scope="col">Количество</th><th scope="col">Единица</th><th scope="col">Цена</th><th scope="col">Сумма</th><th scope="col"><span class="sr-only">Удаление</span></th></tr></thead>
        <tbody id="items"></tbody>
      </table>
      <button type="button" id="add-item" class="add-button">+ Добавить позицию</button>
      <div class="adjustments">
        <label>Скидка, %<input id="discount-rate" type="text" inputmode="decimal" value="0"></label>
        <label>НДС, %<input id="vat-rate" type="text" inputmode="decimal" value="0"></label>
        <label>Валюта<select id="currency"><option>₸</option><option>₽</option><option>$</option><option>€</option></select></label>
      </div>
    </section>

    <section class="card breakdown" aria-label="Расчёт итоговой суммы">
      <div class="summary-row"><span>Сумма</span><output id="subtotal">0 ₸</output></div>
      <div class="summary-row" id="discount-row" hidden><span>Скидка</span><output id="discount-amount">0 ₸</output></div>
      <div class="summary-row" id="discounted-row" hidden><span>Сумма со скидкой</span><output id="discounted-amount">0 ₸</output></div>
      <div class="summary-row" id="vat-row" hidden><span>НДС</span><output id="vat-amount">0 ₸</output></div>
    </section>
    <section class="total-card" aria-label="Итог сметы">
      <span>Итого к оплате</span>
      <output id="total" aria-live="polite" aria-atomic="true">0 ₸</output>
    </section>
    <section class="card comment-card" aria-labelledby="comment-heading">
      <h2 id="comment-heading"><label for="comment">Комментарий</label></h2>
      <textarea id="comment" rows="3" placeholder="Сроки, условия оплаты"></textarea>
    </section>
    <p class="print-only signature">Подпись ____________________</p>
    <div class="actions">
      <button type="button" id="save-pdf" class="save-button">Сохранить PDF</button>
      <button type="button" id="copy-whatsapp" class="add-button">Скопировать для WhatsApp</button>
      <button type="button" id="new-estimate" class="add-button">Новая смета</button>
    </div>
    <p id="copy-status" role="status"></p>
    <p id="storage-status" role="status"></p>
    <div id="manual-copy" hidden>
      <label for="share-text">Скопируйте текст вручную</label>
      <textarea id="share-text" rows="8" readonly></textarea>
    </div>
  </main>

  <template id="item-template">
    <tr>
      <td data-label="Наименование"><input class="item-name" type="text" aria-label="Наименование" placeholder="Товар или услуга"></td>
      <td data-label="Количество"><input class="quantity" type="text" inputmode="decimal" aria-label="Количество" placeholder="0"></td>
      <td data-label="Единица"><select aria-label="Единица"><option>шт</option><option>час</option><option>услуга</option></select></td>
      <td data-label="Цена"><input class="price" type="text" inputmode="decimal" aria-label="Цена" placeholder="0"></td>
      <td data-label="Сумма" class="amount-cell"><output class="line-total">0 ₸</output></td>
      <td class="remove-cell"><button type="button" class="remove-button" aria-label="Удалить позицию">✕</button></td>
    </tr>
  </template>
</body>
</html>
